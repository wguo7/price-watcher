name: watch-shift2
on:
  schedule:
    - cron: '25 17 * * 1-5'   # ~12:25 PM CT start (GitHub may add delay)
    - cron: '55 17 * * 1-5'   # backup slot; dedup below prevents overlap
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - name: Exit if another shift is already running
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.name == \"watch-shift2\")] | length")
          echo "others=$N" >> "$GITHUB_OUTPUT"
          echo "Other running shift2 jobs: $N"
      - name: Run watcher until 15:05 CT
        if: steps.dedup.outputs.others == '0'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          END_CT: "15:05"
        run: node watcher.mjs
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" -d chat_id=${{ secrets.TG_CHAT }} --data-urlencode "text=⚠️ Afternoon price watcher failed — levels unwatched until close. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
